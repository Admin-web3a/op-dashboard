name: Daily OP Dashboard

on:
  schedule:
    - cron: "0 4 * * *"   # 07:00 МСК
    - cron: "0 6 * * *"   # 09:00 МСК (резерв)
  workflow_dispatch:

# Предотвращаем параллельные запуски — второй run отменяет первый
concurrency:
  group: dashboard-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate launch dashboard (zapusk062026)
        env:
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
        run: python generate_amo_report.py
      - name: Generate monthly dashboard (index)
        env:
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
        run: python generate_monthly_report.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/zapusk062026/index.html docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: update dashboards $(date +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main \
            || { git checkout --ours docs/zapusk062026/index.html docs/index.html; \
                 git add docs/zapusk062026/index.html docs/index.html; \
                 git rebase --continue; }
          git push origin main
