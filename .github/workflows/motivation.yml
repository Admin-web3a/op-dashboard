name: Motivation Pages

on:
  # Ручной запуск. По умолчанию пересобирается только страница Фила:
  # цифры Кирилла (CPL/регистрации) вносятся вручную и не должны затираться.
  workflow_dispatch:
    inputs:
      month:
        description: "Месяц (YYYY-MM), пусто = текущий"
        required: false
        default: ""
      only:
        description: "Что пересобирать: phil / kirill / both"
        required: false
        default: "phil"
      kirill_plan_cpl:
        description: "Кирилл: план CPL (руб.)"
        required: false
        default: ""
      kirill_actual_cpl:
        description: "Кирилл: факт CPL (руб.)"
        required: false
        default: ""
      kirill_plan_regs:
        description: "Кирилл: план регистраций"
        required: false
        default: ""
      kirill_actual_regs:
        description: "Кирилл: факт регистраций"
        required: false
        default: ""

  # Каждый день в 08:00 МСК: текущий месяц (страница Фила).
  # 1-го числа дополнительно финализируется предыдущий месяц.
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: motivation-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate motivation pages
        env:
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          AMO_DOMAIN: simmihur.amocrm.ru
          NON_PAID_SOURCES: ${{ secrets.NON_PAID_SOURCES }}
          NON_PAID_MEDIUMS: ${{ secrets.NON_PAID_MEDIUMS }}
          IN_MONTH: ${{ github.event.inputs.month }}
          IN_ONLY: ${{ github.event.inputs.only }}
          IN_PLAN_CPL: ${{ github.event.inputs.kirill_plan_cpl }}
          IN_ACTUAL_CPL: ${{ github.event.inputs.kirill_actual_cpl }}
          IN_PLAN_REGS: ${{ github.event.inputs.kirill_plan_regs }}
          IN_ACTUAL_REGS: ${{ github.event.inputs.kirill_actual_regs }}
          TZ: Europe/Moscow
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # автозапуск: страница Фила за текущий месяц (+ прошлый месяц 1-го числа)
            python -u calc_motivation.py --only phil --out-dir docs/motivation
            if [ "$(date +%d)" = "01" ]; then
              PREV=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m)
              python -u calc_motivation.py --only phil --month "$PREV" --out-dir docs/motivation
            fi
          else
            ARGS="--only ${IN_ONLY:-phil}"
            [ -n "$IN_MONTH" ]       && ARGS="$ARGS --month $IN_MONTH"
            [ -n "$IN_PLAN_CPL" ]    && ARGS="$ARGS --kirill-plan-cpl $IN_PLAN_CPL"
            [ -n "$IN_ACTUAL_CPL" ]  && ARGS="$ARGS --kirill-actual-cpl $IN_ACTUAL_CPL"
            [ -n "$IN_PLAN_REGS" ]   && ARGS="$ARGS --kirill-plan-regs $IN_PLAN_REGS"
            [ -n "$IN_ACTUAL_REGS" ] && ARGS="$ARGS --kirill-actual-regs $IN_ACTUAL_REGS"
            python -u calc_motivation.py $ARGS --out-dir docs/motivation
          fi

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/motivation/
          git diff --cached --quiet || git commit -m "chore: update motivation pages [skip ci]"
          git pull --rebase
          git push
